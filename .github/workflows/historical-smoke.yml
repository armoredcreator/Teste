name: historical-smoke

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src ArmoredIA ArmoredStudio ArmoredHub
      - run: pytest -q tests/test_historical_pipeline.py
